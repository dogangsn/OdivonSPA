<div
  class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md transition-all"
>
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">{{ label() }}</span>
    <div
      class="w-10 h-10 rounded-xl flex items-center justify-center"
      [class]="classes.iconBg + ' ' + classes.iconText"
    >
      <mat-icon class="icon-size-5" [svgIcon]="icon()"></mat-icon>
    </div>
  </div>

  <div class="mt-4">
    <div class="text-4xl sm:text-5xl font-black text-slate-900 dark:text-white tracking-tight leading-none">
      {{ value() }}
      @if (valueSuffix()) {
        <span class="text-xl font-bold text-slate-400">{{ valueSuffix() }}</span>
      }
    </div>
    @if (subLabel()) {
      <div class="text-xs font-semibold mt-1" [class]="classes.valueText">{{ subLabel() }}</div>
    }
  </div>

  <ng-content select="[footer]"></ng-content>
</div>
