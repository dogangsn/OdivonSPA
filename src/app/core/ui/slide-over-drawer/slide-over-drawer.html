@if (open()) {
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 transition-opacity" (click)="onBackdropClick()"></div>

  <div
    class="fixed inset-y-0 right-0 w-full bg-white dark:bg-slate-900 shadow-2xl z-50 flex flex-col border-l border-slate-200 dark:border-slate-800"
    [class]="widthClass()"
  >
    <div class="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
      <div>
        <h3 class="text-lg font-bold text-slate-900 dark:text-white">{{ title() }}</h3>
        @if (subtitle()) {
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{ subtitle() }}</p>
        }
      </div>
      <button
        type="button"
        (click)="closed.emit()"
        class="w-9 h-9 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex items-center justify-center transition-colors cursor-pointer"
      >
        <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-6 space-y-4 custom-scroll">
      <ng-content></ng-content>
    </div>

    <div
      class="p-4 sm:p-6 border-t border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex items-center justify-end gap-3"
    >
      <ng-content select="[drawerFooter]"></ng-content>
    </div>
  </div>
}
