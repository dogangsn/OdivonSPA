@if (open()) {
  <!-- Backdrop with deeper blur -->
  <div
    class="fixed inset-0 bg-slate-950/60 dark:bg-slate-950/80 backdrop-blur-md z-50 transition-opacity animate-in fade-in duration-200"
    (click)="onBackdropClick()"
  ></div>

  <!-- Drawer Panel -->
  <div
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    class="drawer-panel fixed inset-y-0 right-0 w-full bg-white dark:bg-[#0f172a] shadow-2xl z-50 flex flex-col border-l border-slate-200/80 dark:border-slate-800"
    [class]="widthClass()"
  >
    <!-- Top Accent Gradient Bar -->
    <div class="h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-sky-400 w-full shrink-0"></div>

    <!-- Header -->
    <div
      class="sticky top-0 px-6 py-5 border-b border-slate-200/80 dark:border-slate-800 bg-white/95 dark:bg-[#0f172a]/95 backdrop-blur-md flex items-center justify-between gap-4 shrink-0 z-10"
    >
      <div class="flex items-center gap-3.5 min-w-0 flex-1">
        @if (icon()) {
          <div
            class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500/10 via-purple-500/10 to-sky-500/10 dark:from-indigo-500/20 dark:via-purple-500/20 dark:to-sky-500/20 border border-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0 shadow-xs"
          >
            <mat-icon class="icon-size-5.5" [svgIcon]="icon()"></mat-icon>
          </div>
        }
        <div class="min-w-0 flex-1">
          @if (badge()) {
            <div class="mb-1">
              <span
                class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-indigo-50 dark:bg-indigo-950/70 text-indigo-600 dark:text-indigo-400 border border-indigo-200/70 dark:border-indigo-800/60 shadow-2xs"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                {{ badge() }}
              </span>
            </div>
          }
          <h3 class="text-lg font-black text-slate-900 dark:text-white tracking-tight truncate m-0">
            {{ title() }}
          </h3>
          @if (subtitle()) {
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-1 m-0">
              {{ subtitle() }}
            </p>
          }
        </div>
      </div>

      <button
        type="button"
        (click)="closed.emit()"
        aria-label="Paneli kapat"
        class="w-9 h-9 rounded-xl border border-slate-200/80 dark:border-slate-700/80 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 flex items-center justify-center transition-all cursor-pointer hover:rotate-90 active:scale-95 shadow-2xs shrink-0"
      >
        <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
      </button>
    </div>

    <!-- Scrollable Body with subtle background tint -->
    <div class="flex-1 overflow-y-auto p-5 sm:p-6 space-y-5 custom-scroll bg-slate-50/40 dark:bg-[#0b1120]/60">
      <ng-content></ng-content>
    </div>

    <!-- Sticky Glassmorphic Footer -->
    <div
      class="px-5 sm:px-6 py-4 border-t border-slate-200/80 dark:border-slate-800 bg-white/95 dark:bg-[#0f172a]/95 backdrop-blur-md flex items-center justify-between gap-3 shrink-0"
    >
      <div class="hidden sm:flex items-center gap-1.5 text-[11px] font-medium text-slate-400">
        <kbd class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono text-[9px] text-slate-500">ESC</kbd>
        <span>ile kapatılabilir</span>
      </div>
      <div class="flex items-center gap-2.5 ml-auto w-full sm:w-auto justify-end">
        <ng-content select="[drawerFooter]"></ng-content>
      </div>
    </div>
  </div>
}
