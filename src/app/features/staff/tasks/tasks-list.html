<div class="space-y-6">
  <div>
    <h1 class="odv-page-title">Görevler</h1>
    <p class="odv-page-subtitle">Ekip içi görev takibi.</p>
  </div>

  <div class="odv-kpi-grid">
    <app-kpi-card
      label="Açık Görev"
      [value]="countByStatus().acik"
      icon="heroicons_solid:clipboard-document-list"
      accent="amber"
      subLabel="Başlanmadı"
      [footerLeft]="'Listelenen kayıtlar'"
    ></app-kpi-card>
    <app-kpi-card
      label="Devam Eden"
      [value]="countByStatus().devam"
      icon="heroicons_solid:arrow-path"
      accent="sky"
      subLabel="Üzerinde çalışılıyor"
      [footerLeft]="'Listelenen kayıtlar'"
    ></app-kpi-card>
    <app-kpi-card
      label="Tamamlanan"
      [value]="countByStatus().tamamlandi"
      icon="heroicons_solid:check-circle"
      accent="emerald"
      subLabel="Kapanan görev"
      [footerLeft]="'%' + completionRate() + ' tamamlanma'"
    ></app-kpi-card>
    <app-kpi-card
      label="Yüksek Öncelik"
      [value]="highPriorityOpen()"
      icon="heroicons_solid:fire"
      accent="rose"
      subLabel="Açık ve acil"
      [footerLeft]="'Önce bunlar'"
    ></app-kpi-card>
  </div>

  <div class="odv-toolbar">
    <div class="relative flex-1">
      <mat-icon
        class="odv-search-icon icon-size-4.5"
        [svgIcon]="'heroicons_solid:magnifying-glass'"
      ></mat-icon>
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Görev ara..."
        class="odv-search"
      />
    </div>
    <button type="button" (click)="openCreateDrawer()" class="odv-btn-primary">
      <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_solid:plus'"></mat-icon>
      <span>Yeni Görev</span>
    </button>
  </div>

  <div class="space-y-3">
    @for (item of filtered(); track item.id) {
      <div class="odv-panel p-4 flex items-center gap-4">
        <select
          [ngModel]="item.status"
          (ngModelChange)="setStatus(item, $event)"
          class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300"
        >
          @for (s of statuses; track s) {
            <option [value]="s">{{ statusLabels[s] }}</option>
          }
        </select>
        <div class="flex-1 min-w-0">
          <div
            class="text-sm font-bold text-slate-900 dark:text-white truncate"
            [class.line-through]="item.status === 'tamamlandi'"
          >
            {{ item.baslik }}
          </div>
          @if (item.aciklama) {
            <div class="text-xs text-slate-500 dark:text-slate-400 truncate">
              {{ item.aciklama }}
            </div>
          }
        </div>
        <app-status-badge
          [label]="priorityLabels[item.priority]"
          [variant]="priorityVariant[item.priority]"
        ></app-status-badge>
        @if (item.staffId) {
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 hidden sm:inline">{{
            staffNameById().get(item.staffId)
          }}</span>
        }
        @if (item.dueDate) {
          <span class="text-[11px] text-slate-400 hidden sm:inline">{{
            item.dueDate | fsDate
          }}</span>
        }
        <button type="button" (click)="remove(item)" class="odv-icon-btn-danger">
          <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:trash'"></mat-icon>
        </button>
      </div>
    } @empty {
      <app-empty-state
        icon="heroicons_outline:clipboard-document-list"
        title="Henüz Görev Yok"
        description="Yeni bir görev ekleyerek hemen başlayabilirsiniz."
      >
        <button type="button" (click)="openCreateDrawer()" class="odv-btn-soft">
          + İlk Görevi Ekle
        </button>
      </app-empty-state>
    }
  </div>
  <app-load-more [visible]="hasMore()" (more)="listWindow.more()"></app-load-more>
</div>

<app-slide-over-drawer
  [open]="drawerOpen()"
  title="Yeni Görev"
  widthClass="max-w-md"
  (closed)="closeDrawer()"
>
  <div>
    <label class="odv-label">Başlık</label>
    <input type="text" [(ngModel)]="form.baslik" name="baslik" class="odv-input" />
  </div>
  <div>
    <label class="odv-label">Açıklama</label>
    <textarea
      [(ngModel)]="form.aciklama"
      name="aciklama"
      rows="2"
      class="odv-input custom-scroll"
    ></textarea>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="odv-label">Atanan</label>
      <select [(ngModel)]="form.staffId" name="staffId" class="odv-input">
        <option value="">—</option>
        @for (s of staff(); track s.id) {
          <option [value]="s.id">{{ s.ad }}</option>
        }
      </select>
    </div>
    <div>
      <label class="odv-label">Öncelik</label>
      <select [(ngModel)]="form.priority" name="priority" class="odv-input">
        @for (p of priorities; track p) {
          <option [value]="p">{{ priorityLabels[p] }}</option>
        }
      </select>
    </div>
  </div>
  <div>
    <label class="odv-label">Son Tarih</label>
    <input type="date" [(ngModel)]="form.dueDate" name="dueDate" class="odv-input" />
  </div>

  <div drawerFooter class="flex items-center justify-end gap-3 w-full">
    <button type="button" (click)="closeDrawer()" class="odv-btn-secondary">Vazgeç</button>
    <button type="button" (click)="save()" [disabled]="saving()" class="odv-btn-primary">
      {{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}
    </button>
  </div>
</app-slide-over-drawer>
