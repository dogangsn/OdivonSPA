<div class="space-y-6">
  <div>
    <h1 class="odv-page-title">İşletme Ayarları</h1>
    <p class="odv-page-subtitle">
      İşletme adı, saat dilimi, para birimi ve randevu verilebilecek çalışma saatleri.
    </p>
  </div>

  <div class="odv-panel p-6 max-w-2xl space-y-5">
    @if (!loaded()) {
      <p class="text-sm text-slate-500 dark:text-slate-400">Yükleniyor...</p>
    } @else {
      <div>
        <label for="name" class="odv-label">İşletme Adı</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="form.name"
          name="name"
          maxlength="120"
          class="odv-input"
        />
        <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">
          Fişlerde ve ekran başlıklarında görünür.
        </p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="timezone" class="odv-label">Saat Dilimi</label>
          <select id="timezone" [(ngModel)]="form.timezone" name="timezone" class="odv-input">
            @for (tz of timezones; track tz) {
              <option [value]="tz">{{ tz }}</option>
            }
          </select>
          <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">
            Kasa günü sınırları ve fiş numaraları buna göre hesaplanır.
          </p>
        </div>
        <div>
          <label for="currency" class="odv-label">Para Birimi</label>
          <select id="currency" [(ngModel)]="form.currency" name="currency" class="odv-input">
            @for (c of currencies; track c) {
              <option [value]="c">{{ c }}</option>
            }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="workDayStart" class="odv-label">Açılış</label>
          <input
            id="workDayStart"
            type="time"
            [(ngModel)]="form.workDayStart"
            name="workDayStart"
            class="odv-input"
          />
        </div>
        <div>
          <label for="workDayEnd" class="odv-label">Kapanış</label>
          <input
            id="workDayEnd"
            type="time"
            [(ngModel)]="form.workDayEnd"
            name="workDayEnd"
            class="odv-input"
          />
        </div>
      </div>
      <p class="text-[11px] text-slate-400 dark:text-slate-500 -mt-3">
        Bu saatlerin dışına randevu verilemez.
      </p>

      <div class="flex justify-end pt-2">
        <button type="button" (click)="save()" [disabled]="saving()" class="odv-btn-primary">
          {{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}
        </button>
      </div>
    }
  </div>
</div>
