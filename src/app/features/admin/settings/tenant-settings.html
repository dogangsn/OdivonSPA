<div class="space-y-6">
  <div>
    <h1 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight">İşletme Ayarları</h1>
    <p class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">İşletme adı, saat dilimi, para birimi ve randevu verilebilecek çalışma saatleri.</p>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 max-w-2xl space-y-5">
    @if (!loaded()) {
      <p class="text-sm text-slate-500 dark:text-slate-400">Yükleniyor...</p>
    } @else {
      <div>
        <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">İşletme Adı</label>
        <input id="name" type="text" [(ngModel)]="form.name" name="name" maxlength="120" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
        <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Fişlerde ve ekran başlıklarında görünür.</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="timezone" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Saat Dilimi</label>
          <select id="timezone" [(ngModel)]="form.timezone" name="timezone" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all">
            @for (tz of timezones; track tz) { <option [value]="tz">{{ tz }}</option> }
          </select>
          <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Kasa günü sınırları ve fiş numaraları buna göre hesaplanır.</p>
        </div>
        <div>
          <label for="currency" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Para Birimi</label>
          <select id="currency" [(ngModel)]="form.currency" name="currency" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all">
            @for (c of currencies; track c) { <option [value]="c">{{ c }}</option> }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="workDayStart" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Açılış</label>
          <input id="workDayStart" type="time" [(ngModel)]="form.workDayStart" name="workDayStart" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
        </div>
        <div>
          <label for="workDayEnd" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Kapanış</label>
          <input id="workDayEnd" type="time" [(ngModel)]="form.workDayEnd" name="workDayEnd" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
        </div>
      </div>
      <p class="text-[11px] text-slate-400 dark:text-slate-500 -mt-3">Bu saatlerin dışına randevu verilemez.</p>

      <div class="flex justify-end pt-2">
        <button type="button" (click)="save()" [disabled]="saving()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs font-bold shadow-md shadow-indigo-500/20 disabled:opacity-50 cursor-pointer">
          {{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}
        </button>
      </div>
    }
  </div>
</div>
