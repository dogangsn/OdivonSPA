<div class="space-y-6">
  <div>
    <h1 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight">Panel</h1>
    <p class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">
      İşletmenizin genel durumuna hoş geldiniz.
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">
    <app-kpi-card
      label="Toplam Müşteri"
      [value]="customers().length"
      icon="heroicons_solid:user-group"
      accent="emerald"
      subLabel="Kayıtlı Müşteri"
    ></app-kpi-card>

    <app-kpi-card label="Bugünkü Randevu" value="0" icon="heroicons_solid:calendar-days" accent="sky" subLabel="Planlanan Randevu"></app-kpi-card>

    <app-kpi-card label="Bugünkü Ciro" value="₺0,00" icon="heroicons_solid:banknotes" accent="indigo" subLabel="Net Kasa"></app-kpi-card>

    <app-kpi-card label="Bekleyen Prim" value="₺0,00" icon="heroicons_solid:percent-badge" accent="amber" subLabel="Ödenmemiş Tahakkuk"></app-kpi-card>
  </div>
</div>
