<div class="space-y-6">
  <div>
    <h1 class="odv-page-title">Panel</h1>
    <p class="odv-page-subtitle">İşletmenizin genel durumuna hoş geldiniz.</p>
  </div>

  <div class="odv-kpi-grid">
    <app-kpi-card
      label="Toplam Müşteri"
      [value]="customers().length"
      icon="heroicons_solid:user-group"
      accent="emerald"
      subLabel="Kayıtlı Müşteri"
      size="md"
      [footerLeft]="activeCustomerCount() + ' aktif'"
      footerRight="Canlı Veri"
      [live]="true"
    ></app-kpi-card>

    <app-kpi-card
      label="Bugünkü Randevu"
      [value]="appointmentCount()"
      icon="heroicons_solid:calendar-days"
      accent="sky"
      subLabel="Planlanan Randevu"
      size="md"
      [footerLeft]="completedAppointmentCount() + ' tamamlandı'"
      footerRight="Bugün"
    ></app-kpi-card>

    <app-kpi-card
      label="Bugünkü Ciro"
      [value]="'₺' + (revenueToday() | number: '1.2-2')"
      icon="heroicons_solid:banknotes"
      accent="indigo"
      subLabel="Seans + Diğer Ödemeler"
      size="md"
      [footerLeft]="sessionCount() + ' seans'"
      footerRight="Canlı"
      [live]="true"
    ></app-kpi-card>

    @if (auth.isAdmin()) {
      <app-kpi-card
        label="Bekleyen Prim"
        [value]="'₺' + (pendingCommission() | number: '1.2-2')"
        icon="heroicons_solid:percent-badge"
        accent="amber"
        subLabel="Ödenmemiş Tahakkuk"
        size="md"
        [footerLeft]="pendingAccrualCount() + ' kayıt'"
        footerRight="Ödeme bekliyor"
      ></app-kpi-card>
    }
  </div>
</div>
