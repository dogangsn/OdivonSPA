<div class="space-y-6">
  <!-- Header -->
  <div>
    <h1 class="odv-page-title">Müşteriler</h1>
    <p class="odv-page-subtitle">
      Müşteri kartları ve 360° geçmiş — kayıtlar silinmez, pasifleştirilir.
    </p>
  </div>

  <div class="odv-kpi-grid">
    <app-kpi-card
      label="Toplam Müşteri"
      [value]="items().length"
      icon="heroicons_solid:user-group"
      accent="emerald"
      subLabel="Kayıtlı Müşteri"
      [footerLeft]="activeCount() + ' aktif'"
      footerRight="Canlı Veri"
      [live]="true"
    ></app-kpi-card>
    <app-kpi-card
      label="Aktif Müşteri"
      [value]="activeCount()"
      icon="heroicons_solid:user"
      accent="sky"
      subLabel="Hizmet alabilir"
      [footerLeft]="items().length - activeCount() + ' pasif'"
    ></app-kpi-card>
    <app-kpi-card
      label="KVKK Onaylı"
      [value]="kvkkCount()"
      icon="heroicons_solid:shield-check"
      accent="purple"
      subLabel="Aydınlatma onayı alındı"
      [footerLeft]="'%' + kvkkRate() + ' onay oranı'"
    ></app-kpi-card>
    <app-kpi-card
      label="Etiketli"
      [value]="taggedCount()"
      icon="heroicons_solid:tag"
      accent="amber"
      subLabel="VIP, alerji vb. segmentler"
      [footerLeft]="'Segmentli kayıt'"
    ></app-kpi-card>
  </div>

  <!-- Search -->
  <div class="odv-toolbar">
    <div class="relative flex-1">
      <mat-icon
        class="odv-search-icon icon-size-4.5"
        [svgIcon]="'heroicons_solid:magnifying-glass'"
      ></mat-icon>
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Ad veya telefon ile ara..."
        class="odv-search"
      />
    </div>
    <button type="button" (click)="openCreateDrawer()" class="odv-btn-primary">
      <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_solid:plus'"></mat-icon>
      <span>Yeni Müşteri</span>
    </button>
  </div>

  <!-- Table -->
  <div class="odv-panel overflow-hidden">
    <div class="overflow-x-auto custom-scroll">
      <table class="odv-table">
        <thead>
          <tr class="odv-thead-row">
            <th class="py-3.5 px-6">Ad Soyad</th>
            <th class="py-3.5 px-6">Telefon</th>
            <th class="py-3.5 px-6">Kaynak</th>
            <th class="py-3.5 px-6">Etiketler</th>
            <th class="py-3.5 px-6">Durum</th>
            <th class="py-3.5 px-6 text-right">İşlemler</th>
          </tr>
        </thead>
        <tbody class="odv-tbody">
          @for (item of paged(); track item.id) {
            <tr class="odv-tr">
              <td class="py-4 px-6 font-bold text-slate-900 dark:text-white">
                <a
                  [routerLink]="['/musteriler', item.id]"
                  class="hover:text-indigo-600 dark:hover:text-indigo-400"
                >
                  {{ item.ad }}
                </a>
              </td>
              <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{{ item.telefon }}</td>
              <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{{ item.kaynak || '—' }}</td>
              <td class="py-4 px-6">
                <div class="flex flex-wrap gap-1">
                  @for (tag of item.etiketler; track tag) {
                    <span
                      class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-[11px] font-semibold"
                    >
                      {{ tag }}
                    </span>
                  }
                </div>
              </td>
              <td class="py-4 px-6">
                <app-status-badge
                  [label]="item.active ? 'Aktif' : 'Pasif'"
                  [variant]="item.active ? 'emerald' : 'slate'"
                  [dot]="true"
                ></app-status-badge>
              </td>
              <td class="py-4 px-6 text-right">
                <div class="flex items-center justify-end gap-1">
                  <button type="button" (click)="openEditDrawer(item)" class="odv-icon-btn">
                    <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:pencil'"></mat-icon>
                  </button>
                  <button type="button" (click)="togglePassive(item)" class="odv-icon-btn-danger">
                    <mat-icon
                      class="icon-size-4"
                      [svgIcon]="
                        item.active ? 'heroicons_outline:user-minus' : 'heroicons_outline:user-plus'
                      "
                    ></mat-icon>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6">
                <app-empty-state
                  icon="heroicons_outline:users"
                  title="Henüz Müşteri Yok"
                  description="Yeni bir müşteri ekleyerek hemen başlayabilirsiniz."
                >
                  <button type="button" (click)="openCreateDrawer()" class="odv-btn-soft">
                    + İlk Müşteriyi Ekle
                  </button>
                </app-empty-state>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <app-pagination
      [page]="page()"
      [totalPages]="totalPages()"
      (pageChange)="goToPage($event)"
    ></app-pagination>
  </div>
</div>

<app-slide-over-drawer
  [open]="drawerOpen()"
  [title]="isEditing() ? 'Müşteriyi Düzenle' : 'Yeni Müşteri Ekle'"
  subtitle="Bilgileri eksiksiz doldurarak kaydedin."
  (closed)="closeDrawer()"
>
  <div>
    <label class="odv-label"> Ad Soyad <span class="text-rose-500">*</span> </label>
    <input type="text" [(ngModel)]="form.ad" name="ad" class="odv-input" />
  </div>
  <div>
    <label class="odv-label"> Telefon <span class="text-rose-500">*</span> </label>
    <input
      type="text"
      [(ngModel)]="form.telefon"
      name="telefon"
      placeholder="0 5XX XXX XX XX"
      class="odv-input"
    />
  </div>
  <div>
    <label class="odv-label">E-posta</label>
    <input type="email" [(ngModel)]="form.email" name="email" class="odv-input" />
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="odv-label">Cinsiyet</label>
      <select [(ngModel)]="form.cinsiyet" name="cinsiyet" class="odv-input">
        <option value="belirtilmedi">Belirtilmedi</option>
        <option value="kadin">Kadın</option>
        <option value="erkek">Erkek</option>
      </select>
    </div>
    <div>
      <label class="odv-label">Kaynak</label>
      <input
        type="text"
        [(ngModel)]="form.kaynak"
        name="kaynak"
        placeholder="Instagram, Referans..."
        class="odv-input"
      />
    </div>
  </div>
  <div>
    <label class="odv-label">Etiketler</label>
    <input
      type="text"
      [(ngModel)]="form.etiketlerText"
      name="etiketler"
      placeholder="VIP, Alerjik (virgülle ayırın)"
      class="odv-input"
    />
  </div>
  <div>
    <label class="odv-label">Sağlık Notu</label>
    <textarea
      [(ngModel)]="form.saglikNotu"
      name="saglikNotu"
      rows="3"
      class="odv-input custom-scroll"
    ></textarea>
  </div>
  <label class="flex items-center gap-2.5 cursor-pointer">
    <input
      type="checkbox"
      [(ngModel)]="form.kvkkOnay"
      name="kvkkOnay"
      class="w-4 h-4 rounded accent-indigo-600"
    />
    <span class="text-xs font-semibold text-slate-600 dark:text-slate-300"
      >KVKK aydınlatma metni onayı alındı</span
    >
  </label>

  <div drawerFooter class="flex items-center justify-end gap-3 w-full">
    <button type="button" (click)="closeDrawer()" class="odv-btn-secondary">Vazgeç</button>
    <button type="button" (click)="save()" [disabled]="saving()" class="odv-btn-primary">
      <span>{{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}</span>
    </button>
  </div>
</app-slide-over-drawer>
