<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight">Müşteriler</h1>
      <p class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">
        Müşteri kartları ve 360° geçmiş — kayıtlar silinmez, pasifleştirilir.
      </p>
    </div>
    <button
      type="button"
      (click)="openCreateDrawer()"
      class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs sm:text-sm font-bold shadow-lg shadow-indigo-500/25 flex items-center gap-2 transition-all hover:scale-[1.02] active:scale-[0.98] cursor-pointer"
    >
      <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_solid:plus'"></mat-icon>
      <span>+ Yeni Müşteri</span>
    </button>
  </div>

  <!-- Search -->
  <div
    class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs"
  >
    <div class="relative flex-1">
      <mat-icon
        class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 icon-size-4.5"
        [svgIcon]="'heroicons_solid:magnifying-glass'"
      ></mat-icon>
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Ad veya telefon ile ara..."
        class="w-full pl-10 pr-4 py-2.5 rounded-xl text-xs sm:text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"
      />
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
    <div class="overflow-x-auto custom-scroll">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr
            class="border-b border-slate-200/80 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40 text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400"
          >
            <th class="py-3.5 px-6">Ad Soyad</th>
            <th class="py-3.5 px-6">Telefon</th>
            <th class="py-3.5 px-6">Kaynak</th>
            <th class="py-3.5 px-6">Etiketler</th>
            <th class="py-3.5 px-6">Durum</th>
            <th class="py-3.5 px-6 text-right">İşlemler</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 dark:divide-slate-800/80 text-xs sm:text-sm">
          @for (item of paged(); track item.id) {
            <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/50 transition-colors">
              <td class="py-4 px-6 font-bold text-slate-900 dark:text-white">
                <a [routerLink]="['/musteriler', item.id]" class="hover:text-indigo-600 dark:hover:text-indigo-400">
                  {{ item.ad }}
                </a>
              </td>
              <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{{ item.telefon }}</td>
              <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{{ item.kaynak || '—' }}</td>
              <td class="py-4 px-6">
                <div class="flex flex-wrap gap-1">
                  @for (tag of item.etiketler; track tag) {
                    <span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-[11px] font-semibold">
                      {{ tag }}
                    </span>
                  }
                </div>
              </td>
              <td class="py-4 px-6">
                <app-status-badge [label]="item.active ? 'Aktif' : 'Pasif'" [variant]="item.active ? 'emerald' : 'slate'" [dot]="true"></app-status-badge>
              </td>
              <td class="py-4 px-6 text-right">
                <div class="flex items-center justify-end gap-1">
                  <button
                    type="button"
                    (click)="openEditDrawer(item)"
                    class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 hover:text-indigo-600 flex items-center justify-center transition-colors cursor-pointer"
                  >
                    <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:pencil'"></mat-icon>
                  </button>
                  <button
                    type="button"
                    (click)="togglePassive(item)"
                    class="w-8 h-8 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/60 text-slate-400 hover:text-rose-600 flex items-center justify-center transition-colors cursor-pointer"
                  >
                    <mat-icon class="icon-size-4" [svgIcon]="item.active ? 'heroicons_outline:user-minus' : 'heroicons_outline:user-plus'"></mat-icon>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6">
                <app-empty-state icon="heroicons_outline:users" title="Henüz Müşteri Yok" description="Yeni bir müşteri ekleyerek hemen başlayabilirsiniz.">
                  <button
                    type="button"
                    (click)="openCreateDrawer()"
                    class="px-4 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-bold hover:bg-indigo-100 dark:hover:bg-indigo-900/60 transition-colors cursor-pointer"
                  >
                    + İlk Müşteriyi Ekle
                  </button>
                </app-empty-state>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <app-pagination [page]="page()" [totalPages]="totalPages()" (pageChange)="goToPage($event)"></app-pagination>
  </div>
</div>

<app-slide-over-drawer
  [open]="drawerOpen()"
  [title]="isEditing() ? 'Müşteriyi Düzenle' : 'Yeni Müşteri Ekle'"
  subtitle="Bilgileri eksiksiz doldurarak kaydedin."
  (closed)="closeDrawer()"
>
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
      Ad Soyad <span class="text-rose-500">*</span>
    </label>
    <input
      type="text"
      [(ngModel)]="form.ad"
      name="ad"
      class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
    />
  </div>
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
      Telefon <span class="text-rose-500">*</span>
    </label>
    <input
      type="text"
      [(ngModel)]="form.telefon"
      name="telefon"
      placeholder="0 5XX XXX XX XX"
      class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
    />
  </div>
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">E-posta</label>
    <input
      type="email"
      [(ngModel)]="form.email"
      name="email"
      class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
    />
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Cinsiyet</label>
      <select
        [(ngModel)]="form.cinsiyet"
        name="cinsiyet"
        class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"
      >
        <option value="belirtilmedi">Belirtilmedi</option>
        <option value="kadin">Kadın</option>
        <option value="erkek">Erkek</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Kaynak</label>
      <input
        type="text"
        [(ngModel)]="form.kaynak"
        name="kaynak"
        placeholder="Instagram, Referans..."
        class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"
      />
    </div>
  </div>
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Etiketler</label>
    <input
      type="text"
      [(ngModel)]="form.etiketlerText"
      name="etiketler"
      placeholder="VIP, Alerjik (virgülle ayırın)"
      class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"
    />
  </div>
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Sağlık Notu</label>
    <textarea
      [(ngModel)]="form.saglikNotu"
      name="saglikNotu"
      rows="3"
      class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all custom-scroll"
    ></textarea>
  </div>
  <label class="flex items-center gap-2.5 cursor-pointer">
    <input type="checkbox" [(ngModel)]="form.kvkkOnay" name="kvkkOnay" class="w-4 h-4 rounded accent-indigo-600" />
    <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">KVKK aydınlatma metni onayı alındı</span>
  </label>

  <div drawerFooter class="flex items-center justify-end gap-3 w-full">
    <button
      type="button"
      (click)="closeDrawer()"
      class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold transition-all cursor-pointer"
    >
      Vazgeç
    </button>
    <button
      type="button"
      (click)="save()"
      [disabled]="saving()"
      class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs font-bold shadow-md shadow-indigo-500/20 disabled:opacity-50 flex items-center gap-2 cursor-pointer"
    >
      <span>{{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}</span>
    </button>
  </div>
</app-slide-over-drawer>
