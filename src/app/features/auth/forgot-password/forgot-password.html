<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-[#0b1120] px-4">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-2.5 mb-8">
      <app-logo [size]="44" class="rounded-xl shadow-md shadow-indigo-500/20"></app-logo>
      <span class="text-2xl font-black text-slate-900 dark:text-white tracking-tight"
        >OdivonSPA</span
      >
    </div>

    <div class="odv-panel p-6 sm:p-8">
      @if (sent()) {
        <div class="text-center py-4">
          <div
            class="w-14 h-14 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mx-auto mb-4"
          >
            <mat-icon class="icon-size-7" [svgIcon]="'heroicons_outline:envelope'"></mat-icon>
          </div>
          <h1 class="text-lg font-black text-slate-900 dark:text-white">E-posta Gönderildi</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            <strong>{{ email() }}</strong> adresine kayıtlı bir hesap varsa şifre sıfırlama
            bağlantısı gönderildi.
          </p>
        </div>
      } @else {
        <h1 class="text-xl font-black text-slate-900 dark:text-white tracking-tight">
          Şifremi Unuttum
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-6">
          E-posta adresinize bir şifre sıfırlama bağlantısı gönderelim.
        </p>

        <form (ngSubmit)="submit()" class="space-y-4">
          <div>
            <label class="odv-label"> E-posta </label>
            <input
              type="email"
              required
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              name="email"
              class="odv-input"
            />
          </div>

          @if (errorMessage()) {
            <p class="text-xs font-semibold text-rose-600 dark:text-rose-400">
              {{ errorMessage() }}
            </p>
          }

          <button type="submit" [disabled]="submitting()" class="odv-btn-primary w-full text-sm">
            {{ submitting() ? 'Gönderiliyor...' : 'Bağlantı Gönder' }}
          </button>
        </form>
      }

      <p class="text-center mt-5 text-xs text-slate-500 dark:text-slate-400">
        <a
          routerLink="/auth/login"
          class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline"
          >Girişe Dön</a
        >
      </p>
    </div>
  </div>
</div>
