<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-[#0b1120] px-4">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-2.5 mb-8">
      <app-logo [size]="44" class="rounded-xl shadow-md shadow-indigo-500/20"></app-logo>
      <span class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">OdivonSPA</span>
    </div>

    <div
      class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 sm:p-8"
    >
      <h1 class="text-xl font-black text-slate-900 dark:text-white tracking-tight">Giriş Yap</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-6">İşletme panelinize erişmek için giriş yapın.</p>

      <form (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
            E-posta
          </label>
          <input
            type="email"
            required
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            placeholder="ornek@isletme.com"
            class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
            Şifre
          </label>
          <input
            type="password"
            required
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="••••••••"
            class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
          />
        </div>

        @if (errorMessage()) {
          <p class="text-xs font-semibold text-rose-600 dark:text-rose-400">{{ errorMessage() }}</p>
        }

        <button
          type="submit"
          [disabled]="submitting()"
          class="w-full px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-sm font-bold shadow-md shadow-indigo-500/20 disabled:opacity-50 transition-all cursor-pointer"
        >
          {{ submitting() ? 'Giriş yapılıyor...' : 'Giriş Yap' }}
        </button>
      </form>

      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-slate-200 dark:bg-slate-800"></div>
        <span class="text-[11px] font-semibold text-slate-400 uppercase">veya</span>
        <div class="flex-1 h-px bg-slate-200 dark:bg-slate-800"></div>
      </div>

      <button
        type="button"
        (click)="signInWithGoogle()"
        [disabled]="submitting()"
        class="w-full px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 text-sm font-bold disabled:opacity-50 transition-all cursor-pointer flex items-center justify-center gap-2.5"
      >
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
          <path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Google ile giriş yap
      </button>

      <div class="flex items-center justify-between mt-5 text-xs">
        <a routerLink="/auth/forgot-password" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
          Şifremi unuttum
        </a>
        <a routerLink="/auth/onboarding" class="font-semibold text-slate-500 dark:text-slate-400 hover:underline">
          İşletme kaydı oluştur
        </a>
      </div>
    </div>
  </div>
</div>
