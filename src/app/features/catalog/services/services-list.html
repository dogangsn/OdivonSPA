<div class="space-y-6">
  <div>
    <h1 class="odv-page-title">Hizmetler</h1>
    <p class="odv-page-subtitle">Hizmet tanımı, süre, fiyat ve kategori yönetimi.</p>
  </div>

  <div class="odv-kpi-grid">
    <app-kpi-card
      label="Toplam Hizmet"
      [value]="items().length"
      icon="heroicons_solid:sparkles"
      accent="indigo"
      subLabel="Tanımlı hizmet"
      [footerLeft]="activeCount() + ' aktif'"
      footerRight="Canlı Veri"
      [live]="true"
    ></app-kpi-card>
    <app-kpi-card
      label="Kategori"
      [value]="categoryCount()"
      icon="heroicons_solid:squares-plus"
      accent="purple"
      subLabel="Farklı kategori"
      [footerLeft]="'Masaj, cilt bakımı...'"
    ></app-kpi-card>
    <app-kpi-card
      label="Ort. Süre"
      [value]="averageDuration()"
      icon="heroicons_solid:clock"
      accent="sky"
      subLabel="Aktif hizmetler"
      valueSuffix="dk"
      [footerLeft]="'Seans başına'"
    ></app-kpi-card>
    <app-kpi-card
      label="Ort. Fiyat"
      [value]="'₺' + (averagePrice() | number: '1.0-0')"
      icon="heroicons_solid:banknotes"
      accent="emerald"
      subLabel="Aktif hizmetler"
      size="md"
      [footerLeft]="'Liste fiyatı'"
    ></app-kpi-card>
  </div>

  <div class="odv-toolbar">
    <div class="relative flex-1">
      <mat-icon
        class="odv-search-icon icon-size-4.5"
        [svgIcon]="'heroicons_solid:magnifying-glass'"
      ></mat-icon>
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Hizmet veya kategori ara..."
        class="odv-search"
      />
    </div>
    <button type="button" (click)="openCreateDrawer()" class="odv-btn-primary">
      <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_solid:plus'"></mat-icon>
      <span>Yeni Hizmet</span>
    </button>
  </div>

  <div class="odv-panel overflow-hidden">
    <div class="overflow-x-auto custom-scroll">
      <table class="odv-table">
        <thead>
          <tr class="odv-thead-row">
            <th class="py-3.5 px-6">Hizmet</th>
            <th class="py-3.5 px-6">Kategori</th>
            <th class="py-3.5 px-6">Süre</th>
            <th class="py-3.5 px-6">Fiyat</th>
            <th class="py-3.5 px-6">Durum</th>
            <th class="py-3.5 px-6 text-right">İşlemler</th>
          </tr>
        </thead>
        <tbody class="odv-tbody">
          @for (item of paged(); track item.id) {
            <tr class="odv-tr">
              <td class="py-4 px-6 font-bold text-slate-900 dark:text-white">{{ item.ad }}</td>
              <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{{ item.kategori }}</td>
              <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{{ item.sureDk }} dk</td>
              <td class="py-4 px-6 font-semibold text-slate-700 dark:text-slate-200">
                ₺{{ item.fiyat | number: '1.2-2' }}
              </td>
              <td class="py-4 px-6">
                <app-status-badge
                  [label]="item.active ? 'Aktif' : 'Pasif'"
                  [variant]="item.active ? 'emerald' : 'slate'"
                  [dot]="true"
                ></app-status-badge>
              </td>
              <td class="py-4 px-6 text-right">
                <div class="flex items-center justify-end gap-1">
                  <button type="button" (click)="openEditDrawer(item)" class="odv-icon-btn">
                    <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:pencil'"></mat-icon>
                  </button>
                  <button type="button" (click)="togglePassive(item)" class="odv-icon-btn-danger">
                    <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:power'"></mat-icon>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6">
                <app-empty-state
                  icon="heroicons_outline:sparkles"
                  title="Henüz Hizmet Yok"
                  description="Yeni bir hizmet ekleyerek hemen başlayabilirsiniz."
                >
                  <button type="button" (click)="openCreateDrawer()" class="odv-btn-soft">
                    + İlk Hizmeti Ekle
                  </button>
                </app-empty-state>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <app-pagination
      [page]="page()"
      [totalPages]="totalPages()"
      (pageChange)="goToPage($event)"
    ></app-pagination>
  </div>
</div>

<app-slide-over-drawer
  [open]="drawerOpen()"
  [title]="isEditing() ? 'Hizmeti Düzenle' : 'Yeni Hizmet Ekle'"
  [subtitle]="isEditing() ? 'Hizmet parametrelerini ve fiyatlandırmayı güncelleyin.' : 'SPA merkeziniz için yeni bir bakım veya seans hizmeti tanımlayın.'"
  [icon]="'heroicons_outline:sparkles'"
  [badge]="isEditing() ? 'DÜZENLEME' : 'YENİ HİZMET'"
  (closed)="closeDrawer()"
>
  <div class="space-y-4">
    <!-- Form Card 1: Temel Bilgiler -->
    <div class="odv-form-card">
      <div class="odv-form-card-title">
        <mat-icon class="icon-size-4 text-indigo-500" [svgIcon]="'heroicons_outline:identification'"></mat-icon>
        <span>Temel Tanımlar</span>
      </div>

      <div>
        <label class="odv-label">
          <span>Hizmet Adı</span>
          <span class="text-rose-500 font-bold">*</span>
        </label>
        <div class="odv-input-wrap">
          <mat-icon class="odv-input-icon" [svgIcon]="'heroicons_outline:sparkles'"></mat-icon>
          <input
            type="text"
            [(ngModel)]="form.ad"
            name="ad"
            placeholder="Örn. Geleneksel Bali Masajı, Cilt Bakımı..."
            class="odv-input"
            required
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <div>
          <label class="odv-label">
            <span>Kategori</span>
          </label>
          <div class="odv-input-wrap">
            <mat-icon class="odv-input-icon" [svgIcon]="'heroicons_outline:tag'"></mat-icon>
            <input
              type="text"
              [(ngModel)]="form.kategori"
              name="kategori"
              placeholder="Masaj, Cilt Bakımı..."
              class="odv-input"
            />
          </div>
        </div>
        <div>
          <label class="odv-label">
            <span>Tür (Prim Eşleşmesi)</span>
          </label>
          <div class="odv-input-wrap">
            <mat-icon class="odv-input-icon" [svgIcon]="'heroicons_outline:percent-badge'"></mat-icon>
            <input
              type="text"
              [(ngModel)]="form.tur"
              name="tur"
              placeholder="Boş ise kategori kullanılır"
              class="odv-input"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Form Card 2: Süre & Fiyatlandırma -->
    <div class="odv-form-card">
      <div class="odv-form-card-title">
        <mat-icon class="icon-size-4 text-indigo-500" [svgIcon]="'heroicons_outline:banknotes'"></mat-icon>
        <span>Süre & Fiyatlandırma</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <div>
          <label class="odv-label">
            <span>Seans Süresi (dk)</span>
            <span class="text-xs text-indigo-600 dark:text-indigo-400 font-bold">{{ form.sureDk || 0 }} dk</span>
          </label>
          <div class="odv-input-wrap">
            <mat-icon class="odv-input-icon" [svgIcon]="'heroicons_outline:clock'"></mat-icon>
            <input
              type="number"
              min="5"
              step="5"
              [(ngModel)]="form.sureDk"
              name="sureDk"
              placeholder="45"
              class="odv-input"
            />
          </div>
        </div>
        <div>
          <label class="odv-label">
            <span>Hizmet Ücreti (₺)</span>
            <span class="text-xs text-emerald-600 dark:text-emerald-400 font-bold">₺{{ form.fiyat || 0 | number: '1.2-2' }}</span>
          </label>
          <div class="odv-input-wrap">
            <mat-icon class="odv-input-icon" [svgIcon]="'heroicons_outline:currency-dollar'"></mat-icon>
            <input
              type="number"
              min="0"
              step="10"
              [(ngModel)]="form.fiyat"
              name="fiyat"
              placeholder="0.00"
              class="odv-input"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <div drawerFooter class="flex items-center gap-2.5">
    <button type="button" (click)="closeDrawer()" class="odv-btn-secondary">
      Vazgeç
    </button>
    <button
      type="button"
      (click)="save()"
      [disabled]="saving() || !form.ad.trim()"
      class="odv-btn-primary min-w-[130px]"
    >
      <mat-icon class="icon-size-4" [svgIcon]="'heroicons_solid:check'"></mat-icon>
      <span>{{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}</span>
    </button>
  </div>
</app-slide-over-drawer>
