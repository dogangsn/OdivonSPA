<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight">Hizmetler</h1>
      <p class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">Hizmet tanımı, süre, fiyat ve kategori yönetimi.</p>
    </div>
    <button
      type="button"
      (click)="openCreateDrawer()"
      class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs sm:text-sm font-bold shadow-lg shadow-indigo-500/25 flex items-center gap-2 transition-all hover:scale-[1.02] active:scale-[0.98] cursor-pointer"
    >
      <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_solid:plus'"></mat-icon>
      <span>+ Yeni Hizmet</span>
    </button>
  </div>

  <div class="flex items-center gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs">
    <div class="relative flex-1">
      <mat-icon class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 icon-size-4.5" [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Hizmet veya kategori ara..."
        class="w-full pl-10 pr-4 py-2.5 rounded-xl text-xs sm:text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"
      />
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
    <div class="overflow-x-auto custom-scroll">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-200/80 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40 text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
            <th class="py-3.5 px-6">Hizmet</th>
            <th class="py-3.5 px-6">Kategori</th>
            <th class="py-3.5 px-6">Süre</th>
            <th class="py-3.5 px-6">Fiyat</th>
            <th class="py-3.5 px-6">Durum</th>
            <th class="py-3.5 px-6 text-right">İşlemler</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 dark:divide-slate-800/80 text-xs sm:text-sm">
          @for (item of paged(); track item.id) {
            <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/50 transition-colors">
              <td class="py-4 px-6 font-bold text-slate-900 dark:text-white">{{ item.ad }}</td>
              <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{{ item.kategori }}</td>
              <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{{ item.sureDk }} dk</td>
              <td class="py-4 px-6 font-semibold text-slate-700 dark:text-slate-200">₺{{ item.fiyat | number: '1.2-2' }}</td>
              <td class="py-4 px-6">
                <app-status-badge [label]="item.active ? 'Aktif' : 'Pasif'" [variant]="item.active ? 'emerald' : 'slate'" [dot]="true"></app-status-badge>
              </td>
              <td class="py-4 px-6 text-right">
                <div class="flex items-center justify-end gap-1">
                  <button type="button" (click)="openEditDrawer(item)" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 hover:text-indigo-600 flex items-center justify-center transition-colors cursor-pointer">
                    <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:pencil'"></mat-icon>
                  </button>
                  <button type="button" (click)="togglePassive(item)" class="w-8 h-8 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/60 text-slate-400 hover:text-rose-600 flex items-center justify-center transition-colors cursor-pointer">
                    <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:power'"></mat-icon>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6">
                <app-empty-state icon="heroicons_outline:sparkles" title="Henüz Hizmet Yok" description="Yeni bir hizmet ekleyerek hemen başlayabilirsiniz.">
                  <button type="button" (click)="openCreateDrawer()" class="px-4 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-bold hover:bg-indigo-100 dark:hover:bg-indigo-900/60 transition-colors cursor-pointer">
                    + İlk Hizmeti Ekle
                  </button>
                </app-empty-state>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <app-pagination [page]="page()" [totalPages]="totalPages()" (pageChange)="goToPage($event)"></app-pagination>
  </div>
</div>

<app-slide-over-drawer [open]="drawerOpen()" [title]="isEditing() ? 'Hizmeti Düzenle' : 'Yeni Hizmet Ekle'" (closed)="closeDrawer()">
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Hizmet Adı <span class="text-rose-500">*</span></label>
    <input type="text" [(ngModel)]="form.ad" name="ad" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all" />
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Kategori</label>
      <input type="text" [(ngModel)]="form.kategori" name="kategori" placeholder="Masaj, Cilt Bakımı..." class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
    </div>
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Tür (prim eşleşmesi)</label>
      <input type="text" [(ngModel)]="form.tur" name="tur" placeholder="Boş ise kategori kullanılır" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
    </div>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Süre (dk)</label>
      <input type="number" min="1" [(ngModel)]="form.sureDk" name="sureDk" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
    </div>
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Fiyat (₺)</label>
      <input type="number" min="0" step="0.01" [(ngModel)]="form.fiyat" name="fiyat" class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
    </div>
  </div>

  <div drawerFooter class="flex items-center justify-end gap-3 w-full">
    <button type="button" (click)="closeDrawer()" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold transition-all cursor-pointer">Vazgeç</button>
    <button type="button" (click)="save()" [disabled]="saving()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs font-bold shadow-md shadow-indigo-500/20 disabled:opacity-50 flex items-center gap-2 cursor-pointer">
      {{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}
    </button>
  </div>
</app-slide-over-drawer>
