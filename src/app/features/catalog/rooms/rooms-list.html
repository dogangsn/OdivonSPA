<div class="space-y-6">
  <div>
    <h1 class="odv-page-title">Odalar</h1>
    <p class="odv-page-subtitle">Oda tanımı, kapasite ve doluluk yönetimi.</p>
  </div>

  <div class="odv-kpi-grid">
    <app-kpi-card
      label="Toplam Oda"
      [value]="items().length"
      icon="heroicons_solid:home-modern"
      accent="indigo"
      subLabel="Tanımlı oda"
      [footerLeft]="activeCount() + ' aktif'"
      footerRight="Canlı Veri"
      [live]="true"
    ></app-kpi-card>
    <app-kpi-card
      label="Aktif Oda"
      [value]="activeCount()"
      icon="heroicons_solid:check-circle"
      accent="emerald"
      subLabel="Randevuya açık"
      [footerLeft]="items().length - activeCount() + ' pasif'"
    ></app-kpi-card>
    <app-kpi-card
      label="Toplam Kapasite"
      [value]="totalCapacity()"
      icon="heroicons_solid:users"
      accent="sky"
      subLabel="Aktif odalarda"
      valueSuffix="kişi"
      [footerLeft]="'Eş zamanlı kişi'"
    ></app-kpi-card>
    <app-kpi-card
      label="Ort. Kapasite"
      [value]="averageCapacity()"
      icon="heroicons_solid:chart-bar"
      accent="purple"
      subLabel="Oda başına"
      [footerLeft]="'Aktif odalar'"
    ></app-kpi-card>
  </div>

  <div class="odv-toolbar">
    <div class="relative flex-1">
      <mat-icon
        class="odv-search-icon icon-size-4.5"
        [svgIcon]="'heroicons_solid:magnifying-glass'"
      ></mat-icon>
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Oda ara..."
        class="odv-search"
      />
    </div>
    <button type="button" (click)="openCreateDrawer()" class="odv-btn-primary">
      <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_solid:plus'"></mat-icon>
      <span>Yeni Oda</span>
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
    @for (item of filtered(); track item.id) {
      <div class="odv-panel p-5 hover:shadow-md transition-all">
        <div class="flex items-start justify-between">
          <div
            class="w-11 h-11 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center"
          >
            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:home-modern'"></mat-icon>
          </div>
          <app-status-badge
            [label]="item.active ? 'Aktif' : 'Pasif'"
            [variant]="item.active ? 'emerald' : 'slate'"
            [dot]="true"
          ></app-status-badge>
        </div>
        <h3 class="mt-3 text-base font-bold text-slate-900 dark:text-white">{{ item.ad }}</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
          Kapasite: {{ item.kapasite }} kişi
        </p>
        <div class="flex items-center justify-end gap-1 mt-4">
          <button type="button" (click)="openEditDrawer(item)" class="odv-icon-btn">
            <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:pencil'"></mat-icon>
          </button>
          <button type="button" (click)="togglePassive(item)" class="odv-icon-btn-danger">
            <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:power'"></mat-icon>
          </button>
        </div>
      </div>
    } @empty {
      <div class="sm:col-span-2 lg:col-span-3">
        <app-empty-state
          icon="heroicons_outline:home-modern"
          title="Henüz Oda Yok"
          description="Yeni bir oda ekleyerek hemen başlayabilirsiniz."
        >
          <button type="button" (click)="openCreateDrawer()" class="odv-btn-soft">
            + İlk Odayı Ekle
          </button>
        </app-empty-state>
      </div>
    }
  </div>
</div>

<app-slide-over-drawer
  [open]="drawerOpen()"
  [title]="isEditing() ? 'Odayı Düzenle' : 'Yeni Oda Ekle'"
  widthClass="max-w-md"
  (closed)="closeDrawer()"
>
  <div>
    <label class="odv-label">Oda Adı <span class="text-rose-500">*</span></label>
    <input type="text" [(ngModel)]="form.ad" name="ad" class="odv-input" />
  </div>
  <div>
    <label class="odv-label">Kapasite</label>
    <input type="number" min="1" [(ngModel)]="form.kapasite" name="kapasite" class="odv-input" />
  </div>

  <div drawerFooter class="flex items-center justify-end gap-3 w-full">
    <button type="button" (click)="closeDrawer()" class="odv-btn-secondary">Vazgeç</button>
    <button type="button" (click)="save()" [disabled]="saving()" class="odv-btn-primary">
      {{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}
    </button>
  </div>
</app-slide-over-drawer>
