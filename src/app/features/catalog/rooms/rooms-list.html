<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight">Odalar</h1>
      <p class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">Oda tanımı, kapasite ve doluluk yönetimi.</p>
    </div>
    <button
      type="button"
      (click)="openCreateDrawer()"
      class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs sm:text-sm font-bold shadow-lg shadow-indigo-500/25 flex items-center gap-2 transition-all hover:scale-[1.02] active:scale-[0.98] cursor-pointer"
    >
      <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_solid:plus'"></mat-icon>
      <span>+ Yeni Oda</span>
    </button>
  </div>

  <div class="flex items-center gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs">
    <div class="relative flex-1">
      <mat-icon class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 icon-size-4.5" [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Oda ara..."
        class="w-full pl-10 pr-4 py-2.5 rounded-xl text-xs sm:text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
    @for (item of filtered(); track item.id) {
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 shadow-sm hover:shadow-md transition-all">
        <div class="flex items-start justify-between">
          <div
            class="w-11 h-11 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center"
          >
            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:home-modern'"></mat-icon>
          </div>
          <app-status-badge [label]="item.active ? 'Aktif' : 'Pasif'" [variant]="item.active ? 'emerald' : 'slate'" [dot]="true"></app-status-badge>
        </div>
        <h3 class="mt-3 text-base font-bold text-slate-900 dark:text-white">{{ item.ad }}</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Kapasite: {{ item.kapasite }} kişi</p>
        <div class="flex items-center justify-end gap-1 mt-4">
          <button
            type="button"
            (click)="openEditDrawer(item)"
            class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 hover:text-indigo-600 flex items-center justify-center transition-colors cursor-pointer"
          >
            <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:pencil'"></mat-icon>
          </button>
          <button
            type="button"
            (click)="togglePassive(item)"
            class="w-8 h-8 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/60 text-slate-400 hover:text-rose-600 flex items-center justify-center transition-colors cursor-pointer"
          >
            <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:power'"></mat-icon>
          </button>
        </div>
      </div>
    } @empty {
      <div class="sm:col-span-2 lg:col-span-3">
        <app-empty-state icon="heroicons_outline:home-modern" title="Henüz Oda Yok" description="Yeni bir oda ekleyerek hemen başlayabilirsiniz.">
          <button
            type="button"
            (click)="openCreateDrawer()"
            class="px-4 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-bold hover:bg-indigo-100 dark:hover:bg-indigo-900/60 transition-colors cursor-pointer"
          >
            + İlk Odayı Ekle
          </button>
        </app-empty-state>
      </div>
    }
  </div>
</div>

<app-slide-over-drawer [open]="drawerOpen()" [title]="isEditing() ? 'Odayı Düzenle' : 'Yeni Oda Ekle'" widthClass="max-w-md" (closed)="closeDrawer()">
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Oda Adı <span class="text-rose-500">*</span></label>
    <input
      type="text"
      [(ngModel)]="form.ad"
      name="ad"
      class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
    />
  </div>
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Kapasite</label>
    <input
      type="number"
      min="1"
      [(ngModel)]="form.kapasite"
      name="kapasite"
      class="w-full px-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
    />
  </div>

  <div drawerFooter class="flex items-center justify-end gap-3 w-full">
    <button type="button" (click)="closeDrawer()" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold transition-all cursor-pointer">
      Vazgeç
    </button>
    <button
      type="button"
      (click)="save()"
      [disabled]="saving()"
      class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs font-bold shadow-md shadow-indigo-500/20 disabled:opacity-50 flex items-center gap-2 cursor-pointer"
    >
      {{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}
    </button>
  </div>
</app-slide-over-drawer>
