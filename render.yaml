services:
  - type: web
    name: odivonspa-server
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://odivonspa.web.app,https://odivonspa.firebaseapp.com
