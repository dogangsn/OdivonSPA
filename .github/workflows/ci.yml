name: CI

# master pushes run the unit tests in deploy-firebase.yml before deploying.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Production build
        run: npm run build

