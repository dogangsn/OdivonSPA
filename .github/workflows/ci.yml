name: CI

on:
  pull_request:
  push:
    branches-ignore: [master] # master runs the same checks in deploy-firebase.yml before deploying

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Production build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Typecheck
        run: npm run typecheck --prefix server
      - name: Unit tests
        run: npm test --prefix server

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          npm install --global npm@11.16.0 firebase-tools@15.30.2
          npm ci
          npm ci --prefix server
      - name: Emulator end-to-end checks (rules + API)
        run: npm run test:e2e
