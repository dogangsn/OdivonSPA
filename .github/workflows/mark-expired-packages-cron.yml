name: Mark expired packages

on:
  schedule:
    # 00:00 UTC daily = 03:00 Europe/Istanbul (Turkey has no DST)
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # Requires repository secrets SERVER_BASE_URL (e.g. https://odivonspa-server.onrender.com)
      # and INTERNAL_CRON_SECRET (same value as on Render). A failed run emails the workflow owner.
      - name: Check secrets
        env:
          SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          if [ -z "$SERVER_BASE_URL" ] || [ -z "$INTERNAL_CRON_SECRET" ]; then
            echo "::error::SERVER_BASE_URL and INTERNAL_CRON_SECRET repository secrets must be set."
            exit 1
          fi
      - name: Wake the server
        # Render's free plan sleeps idle services; a cold start can take over a minute.
        run: curl -s -o /dev/null --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors "${{ secrets.SERVER_BASE_URL }}/health" || true
      - name: Call /internal/mark-expired-packages
        run: |
          curl -sf -X POST \
            -H "X-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}" \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            "${{ secrets.SERVER_BASE_URL }}/internal/mark-expired-packages"
